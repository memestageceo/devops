apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.platform.saas.io
spec:
  group: platform.saas.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        # openAPIV3Schema is the schema for validating custom objects.
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantName
                - plan
              properties:
                tenantName:
                  type: string
                plan:
                  type: string
                  enum:
                    - free
                    - pro
                    - enterprise
                subdomain:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                resourceQuota:
                  type: object
                  properties:
                    maxCPU:
                      type: string
                    maxMemory:
                      type: string
                    maxPods:
                      type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Provisioning
                    - Active
                    - Suspended
                namespaceCreated:
                  type: boolean
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: tenants
    singular: tenant
    kind: Tenant
