apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobpolicies.scheduling.platform.io
spec:
  group: scheduling.platform.io
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parallelism
              properties:
                schedule:
                  type: string
                image:
                  type: string
                command:
                  type: array
                  items:
                    type: string
                timeoutSeconds:
                  type: integer
                parallelism:
                  type: integer
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                    backoffSeconds:
                      type: integer
                alerting:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    slackChannel:
                      type: string
                    emailRecipients:
                      type: string
            status:
              type: object
              properties:
                lastRunTime:
                  type: integer
                lastRunStatus:
                  type: string
                  enum:
                    - Success
                    - Failed
                    - Running
                consecutiveFailures:
                  type: integer
      # subresources describes the subresources for custom resources.
      subresources:
        # status enables the status subresource.
        status: {}
        scale:
          specReplicasPath: .spec.parallelism
          statusReplicasPath: .status.parallelism
  scope: Namespaced
  names:
    plural: jobpolicies
    singular: jobpolicies
    kind: JobPolicy
    shortNames:
      - jp
