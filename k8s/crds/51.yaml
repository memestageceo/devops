apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: certificaterequests.security.internal.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: security.internal.io
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1
      # Each version can be enabled/disabled by Served flag.
      served: true
      # One and only one version must be marked as the storage version.
      storage: true
      additionalPrinterColumns:
        - name: COMMON-NAME
          type: string
          description: The common name for the item
          jsonPath: .spec.
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              properties:
                notBefore:
                  type: string
                notAfter:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - True
                          - False
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                phase:
                  type: string
                  enum:
                    - Pending
                    - Issued
                    - Expired
                    - Failed
            spec:
              type: object
              properties:
                commonName:
                  type: string
                dnsNames:
                  type: string
                duration:
                  type: string
                renewBefore:
                  type: string
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                issuer:
                  type: object
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - ClusterIssuer
                        - Issuer
  # either Namespaced or Cluster
  scope: Namespaced
  names:
    # plural name to be used in the URL: /apis/<group>/<version>/<plural>
    plural: certificaterequests
    # singular name to be used as an alias on the CLI and for display
    singular: certificaterequest
    # kind is normally the CamelCased singular type. Your resource manifests use this.
    kind: CertificateRequest
    # shortNames allow shorter string to match your resource on the CLI
    shortNames:
      - creq
